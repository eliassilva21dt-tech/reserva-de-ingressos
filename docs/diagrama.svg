<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="setaLaranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1600" height="960" fill="#ffffff"/>

  <text x="800" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Reserva de Ingressos — Arquitetura</text>
  <text x="800" y="76" text-anchor="middle" font-size="16" fill="#475569">Computação Distribuída · UFMS · tudo roda localmente com docker compose up</text>

  <!-- Redes Docker -->
  <rect x="520" y="95" width="1030" height="725" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="1535" y="118" text-anchor="end" font-size="15" font-weight="600" fill="#64748b">back-net (rede interna dos serviços)</text>
  <rect x="250" y="215" width="520" height="415" rx="14" fill="#eff6ff" fill-opacity="0.7" stroke="#60a5fa" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="265" y="240" font-size="15" font-weight="600" fill="#2563eb">front-net</text>

  <!-- Cliente -->
  <rect x="40" y="390" width="160" height="100" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="120" y="432" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Cliente</text>
  <text x="120" y="456" text-anchor="middle" font-size="14" fill="#475569">navegador, curl,</text>
  <text x="120" y="475" text-anchor="middle" font-size="14" fill="#475569">scripts de carga</text>

  <!-- nginx -->
  <rect x="275" y="390" width="170" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="428" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">proxy (nginx)</text>
  <text x="360" y="452" text-anchor="middle" font-size="14" fill="#1e40af">porta 8080</text>
  <text x="360" y="472" text-anchor="middle" font-size="14" fill="#1e40af">balanceia as réplicas</text>

  <!-- API réplicas -->
  <rect x="545" y="270" width="200" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="305" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">api · réplica 1</text>
  <text x="645" y="328" text-anchor="middle" font-size="14" fill="#166534">FastAPI, sem estado</text>
  <text x="645" y="348" text-anchor="middle" font-size="14" fill="#166534">MODO_LOCK: none | db | redis</text>

  <rect x="545" y="510" width="200" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="545" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">api · réplica 2</text>
  <text x="645" y="568" text-anchor="middle" font-size="14" fill="#166534">FastAPI, sem estado</text>
  <text x="645" y="588" text-anchor="middle" font-size="14" fill="#166534">(escala com --scale api=N)</text>
  <text x="645" y="450" text-anchor="middle" font-size="28" fill="#16a34a">⋮</text>

  <!-- Redis -->
  <rect x="860" y="125" width="220" height="100" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="970" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#7f1d1d">Redis</text>
  <text x="970" y="186" text-anchor="middle" font-size="14" fill="#991b1b">lock por assento</text>
  <text x="970" y="206" text-anchor="middle" font-size="14" fill="#991b1b">SET NX EX 30</text>

  <!-- RabbitMQ -->
  <rect x="860" y="385" width="220" height="110" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="970" y="422" text-anchor="middle" font-size="20" font-weight="700" fill="#7c2d12">RabbitMQ</text>
  <text x="970" y="446" text-anchor="middle" font-size="14" fill="#9a3412">fila durável</text>
  <text x="970" y="466" text-anchor="middle" font-size="14" fill="#9a3412">reservas.pagamento</text>
  <text x="970" y="485" text-anchor="middle" font-size="12" fill="#9a3412">painel :15672</text>

  <!-- Postgres -->
  <rect x="860" y="675" width="220" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="970" y="712" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">Postgres</text>
  <text x="970" y="736" text-anchor="middle" font-size="14" fill="#5b21b6">reservas · índice único parcial</text>
  <text x="970" y="756" text-anchor="middle" font-size="14" fill="#5b21b6">volume pgdata</text>

  <!-- pagamento -->
  <rect x="1270" y="385" width="240" height="110" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1390" y="422" text-anchor="middle" font-size="20" font-weight="700" fill="#713f12">pagamento-service</text>
  <text x="1390" y="446" text-anchor="middle" font-size="14" fill="#854d0e">consumidor · ack manual</text>
  <text x="1390" y="466" text-anchor="middle" font-size="14" fill="#854d0e">prefetch=1 · 1–3 s · ~10% recusa</text>

  <!-- Setas: cliente -> proxy -> apis -->
  <line x1="200" y1="440" x2="273" y2="440" stroke="#334155" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="236" y="428" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">HTTP</text>

  <path d="M445,440 H495 V320 H543" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M495,440 V560 H543" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="500" y="408" font-size="13" font-weight="600" fill="#334155">round-robin</text>

  <!-- barramento das APIs -->
  <path d="M745,320 H800 M745,560 H800" fill="none" stroke="#334155" stroke-width="2.5"/>
  <line x1="800" y1="175" x2="800" y2="725" stroke="#334155" stroke-width="2.5"/>
  <line x1="800" y1="175" x2="858" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="800" y1="440" x2="858" y2="440" stroke="#334155" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="800" y1="725" x2="858" y2="725" stroke="#334155" stroke-width="2.5" marker-end="url(#seta)"/>

  <g font-size="14" font-weight="700" fill="#0f172a">
    <circle cx="830" cy="153" r="13" fill="#0f172a"/><text x="830" y="158" text-anchor="middle" fill="#fff" font-size="13">1</text>
    <circle cx="830" cy="418" r="13" fill="#0f172a"/><text x="830" y="423" text-anchor="middle" fill="#fff" font-size="13">3</text>
    <circle cx="830" cy="703" r="13" fill="#0f172a"/><text x="830" y="708" text-anchor="middle" fill="#fff" font-size="13">2</text>
  </g>

  <!-- RabbitMQ -> pagamento -->
  <line x1="1080" y1="440" x2="1268" y2="440" stroke="#c2410c" stroke-width="2.5" marker-end="url(#setaLaranja)"/>
  <circle cx="1174" cy="418" r="13" fill="#c2410c"/><text x="1174" y="423" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text>
  <text x="1174" y="468" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="600">consome</text>

  <!-- pagamento -> Postgres -->
  <path d="M1390,495 V725 H1082" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#seta)"/>
  <circle cx="1390" cy="610" r="13" fill="#7c3aed"/><text x="1390" y="615" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">5</text>
  <text x="1372" y="598" text-anchor="end" font-size="13" fill="#5b21b6" font-weight="600">UPDATE status</text>
  <text x="1372" y="616" text-anchor="end" font-size="13" fill="#5b21b6">CONFIRMADA / RECUSADA</text>

  <!-- pagamento -> Redis -->
  <path d="M1390,385 V175 H1082" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#seta)"/>
  <circle cx="1390" cy="280" r="13" fill="#dc2626"/><text x="1390" y="285" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">6</text>
  <text x="1408" y="262" font-size="13" fill="#991b1b" font-weight="600">DEL lock</text>
  <text x="1408" y="280" font-size="13" fill="#991b1b">se RECUSADA</text>

  <!-- Legenda do fluxo -->
  <g transform="translate(0,130)">
  <rect x="40" y="520" width="440" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="552" font-size="17" font-weight="700" fill="#0f172a">Fluxo de uma reserva (POST /reservas)</text>
  <g font-size="14" fill="#334155">
    <text x="60" y="582"><tspan font-weight="700">1</tspan> · API tenta o lock do assento no Redis</text>
    <text x="78" y="601" fill="#64748b">(modo redis; se falhar → 409)</text>
    <text x="60" y="630"><tspan font-weight="700">2</tspan> · grava a reserva PENDENTE no Postgres</text>
    <text x="78" y="649" fill="#64748b">(índice único: 2ª barreira contra overbooking)</text>
    <text x="60" y="678"><tspan font-weight="700">3</tspan> · publica {reserva_id, assento_id} na fila</text>
    <text x="78" y="697" fill="#64748b">(mensagem persistente) e responde 201</text>
    <text x="60" y="726"><tspan font-weight="700">4</tspan> · pagamento consome e simula o pagamento</text>
    <text x="60" y="755"><tspan font-weight="700">5</tspan> · atualiza o status e só então dá ack</text>
    <text x="78" y="774" fill="#64748b">(se o serviço cair, a mensagem é reentregue)</text>
    <text x="60" y="803"><tspan font-weight="700">6</tspan> · se RECUSADA, libera o assento (apaga o lock)</text>
  </g>
  </g>

  <text x="1535" y="945" text-anchor="end" font-size="13" fill="#94a3b8">Só o proxy publica porta no host (8080); RabbitMQ expõe :15672 apenas para desenvolvimento.</text>
</svg>
