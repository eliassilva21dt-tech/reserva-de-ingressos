worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Log com o endereço da réplica que atendeu ($upstream_addr): evidência do balanceamento.
    log_format main '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # DNS interno do Docker. "valid=5s" faz o nginx re-resolver o nome "api"
    # a cada 5 s, então novas réplicas (--scale api=N) entram sem reiniciar o proxy.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {
            # Usar variável no proxy_pass é o que obriga o nginx a re-resolver o DNS.
            set $upstream http://api:8000;
            proxy_pass $upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Se uma réplica não aceitar a conexão (caiu), tenta outra.
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
